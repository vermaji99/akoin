<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cubeGradientFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E65A00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon Group -->
  <g transform="translate(10, 0)">
    <!-- Outer Frame (Digital Infrastructure) -->
    <path d="M50 15 L95 40 L95 85 L50 110 L5 85 L5 40 Z" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- The Core Cube (Resilience & Structure) -->
    <g transform="translate(50, 62.5)">
      <!-- Top -->
      <path d="M0 -25 L21.65 -12.5 L0 0 L-21.65 -12.5 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
      <!-- Left -->
      <path d="M-21.65 -12.5 L0 0 L0 25 L-21.65 12.5 Z" fill="url(#cubeGradientFull)" stroke="#111111" stroke-width="1.5"/>
      <!-- Right -->
      <path d="M0 0 L21.65 -12.5 L21.65 12.5 L0 25 Z" fill="#111111" stroke="#111111" stroke-width="1.5"/>
    </g>
    
    <!-- Connection Nodes -->
    <circle cx="50" cy="15" r="3" fill="#FF6A00"/>
    <circle cx="95" cy="40" r="3" fill="#111111"/>
    <circle cx="95" cy="85" r="3" fill="#111111"/>
    <circle cx="50" cy="110" r="3" fill="#111111"/>
    <circle cx="5" cy="85" r="3" fill="#111111"/>
    <circle cx="5" cy="40" r="3" fill="#111111"/>
  </g>
  
  <!-- Text Group -->
  <g transform="translate(130, 60)">
    <text font-family="'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="34" fill="#111111">
      <tspan x="0" dy="8">Institute of Digital Risk</tspan>
    </text>
  </g>
</svg>