<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E65A00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer Frame (Digital Infrastructure) -->
  <path d="M60 15 L105 40 L105 85 L60 110 L15 85 L15 40 Z" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- The Core Cube (Resilience & Structure) -->
  <g transform="translate(60, 62.5)">
    <!-- Top -->
    <path d="M0 -25 L21.65 -12.5 L0 0 L-21.65 -12.5 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <!-- Left -->
    <path d="M-21.65 -12.5 L0 0 L0 25 L-21.65 12.5 Z" fill="url(#cubeGradient)" stroke="#111111" stroke-width="1.5"/>
    <!-- Right -->
    <path d="M0 0 L21.65 -12.5 L21.65 12.5 L0 25 Z" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  </g>
  
  <!-- Connection Nodes (Interconnected Systems) -->
  <circle cx="60" cy="15" r="3" fill="#FF6A00"/>
  <circle cx="105" cy="40" r="3" fill="#111111"/>
  <circle cx="105" cy="85" r="3" fill="#111111"/>
  <circle cx="60" cy="110" r="3" fill="#111111"/>
  <circle cx="15" cy="85" r="3" fill="#111111"/>
  <circle cx="15" cy="40" r="3" fill="#111111"/>
</svg>